services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: kanban_user
      POSTGRES_PASSWORD: kanban_pass
      POSTGRES_DB: kanban_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_user -d kanban_db"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build: ./Mini_Kanban_Board_Server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://kanban_user:kanban_pass@db:5432/kanban_db?schema=public"
      JWT_SECRET_KEY: "replace-with-a-long-random-secret"
      JWT_EXPIRES_IN: "7d"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start"

  frontend:  
    build:
      context: ./mini_kanban_board_client
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:5000/api/v1"
    ports:
      - "3000:3000"
    environment:
      BACKEND_INTERNAL_URL: "http://backend:5000"
    depends_on:
      - backend

volumes:
  pgdata: